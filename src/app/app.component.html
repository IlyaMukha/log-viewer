<div class="container-fluid vh-100 d-flex flex-column p-0">
  
  <app-header-info 
    [isDarkTheme]="isDarkTheme" 
    [projectsLoading]="projectsLoading" 
    (refreshProjects)="loadProjects()" 
    (toggleTheme)="toggleTheme()" 
    class="d-flex flex-shrink-0 justify-content-between align-items-center px-2 py-1 border-bottom bg-body">
  </app-header-info>

  <div class="row flex-grow-1 g-0">

    <app-iis-info
      [projects]="projects"
      [projectsError]="projectsError"
      [projectsLoading]="projectsLoading"
      [expandedProject]="expandedProject"
      [expandedDirectory]="expandedDirectory"
      [directoryContents]="directoryContents"
      (selectLogDirectory)="selectLogDirectory($event.project, $event.name)"
      (toggleDirectory)="toggleDirectory($event)"
      (toggleProject)="toggleProject($event)"
      class="col-12 col-md-4 col-lg-3 col-xl-3 border-end bg-body-tertiary d-flex flex-column">
    </app-iis-info>

    <app-main-info 
      [logs]="logs || []" 
      [errorMessage]="errorMessage" 
      [url]="url" 
      [loading]="loading" 
      class="col-12 col-md-4 col-lg-9 col-xl-9 border-end bg-body-tertiary d-flex flex-column">
    </app-main-info>

  </div>
</div>
