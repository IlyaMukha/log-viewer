<div class="list-group">
    <ng-container *ngFor="let item of items">

        <div class="list-group-item d-flex align-items-center gap-2">
            <button *ngIf="item.type === 0"
                type="button"
                class="btn btn-sm p-0"
                (click)="toggleDirectory(item.name)">
                {{ expanded[item.name] ? '👇' : '👉' }}
            </button>

            <button class="btn btn-link text-decoration-none d-flex align-items-center gap-2 flex-grow-1 text-start p-0 min-w-0" [title]="item.name">
                <span *ngIf="item.type === 1" class="px-2">📄</span>
                <span *ngIf="item.type === 0" class="px-2">📁</span>
                {{ item.shortName }}
            </button>
        </div>

        <div *ngIf="item.type === 0 && expanded[item.name]" class="ms-4">
            <div *ngIf="loading[item.name]" class="list-group-item text-muted small">Загрузка...</div>
            <app-directory-tree *ngIf="contents[item.name]" [items]="contents[item.name]"></app-directory-tree>
        </div>

    </ng-container>
</div>
